name: Build LaTeX document
on: [push]
jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v2
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v2
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
      - name: Check pdf file
        run: |
          file main.pdf | grep -q ' PDF '
      - name: Upload file to repository
        env:
         GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "sruthyjoseph98-creator"
          git config --global user.email "sruthyjoseph98@gmail.com"
          git remote set-url origin https://sruthyjoseph98-creator:${{ secrets.GH_PAT }}@github.com/sruthyjoseph98-creator/HA-notes.git
          git add main.pdf
          git commit -m "Compile main.pdf"
          git push origin HEAD
